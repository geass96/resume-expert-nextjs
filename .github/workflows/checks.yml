name: Next.js checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: node scripts/integration.mjs
      - name: Package tested ARM64 release
        run: |
          test ! -e .next/standalone/.env
          test ! -e .next/standalone/.env.local
          mkdir -p outputs
          cp -a .next/static .next/standalone/.next/static
          if test -d public; then cp -a public .next/standalone/public; fi
          tar -czf outputs/resume-expert-arm64.tar.gz -C .next/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: resume-expert-arm64-${{ github.sha }}
          path: outputs/resume-expert-arm64.tar.gz
          retention-days: 14
          if-no-files-found: error
